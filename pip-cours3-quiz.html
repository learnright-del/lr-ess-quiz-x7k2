<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip's English Adventure — Quiz Cours 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#26A69A; --teal-dark:#1B8177; --coral:#FF6F59; --coral-dark:#E5533D;
  --gold:#F5A623; --navy:#1B2A41; --cream:#FDF3E7; --paper:#FFFFFF;
  --ink:#1B2A41; --muted:rgba(27,42,65,.62);
  --ok:#2AAF97; --bad:#E5533D;
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--navy); font-family:'Nunito',sans-serif; color:var(--ink); }
h1,h2,h3{ font-family:'Baloo 2','Nunito',sans-serif; margin:0; }
button{ font-family:inherit; cursor:pointer; }

.app{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.screen{ width:100%; max-width:860px; background:var(--paper); border-radius:26px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  padding:38px 44px 34px; position:relative; overflow:hidden; }

/* ---------------- header ---------------- */
.top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand .logo{ font-size:34px; }
.brand .name{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--navy); }
.brand .name span{ color:var(--coral); }

/* ---------------- menu screen ---------------- */
.menu-title{ text-align:center; margin:6px 0 2px; }
.menu-title .kicker{ display:block; font-weight:800; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--coral); margin-bottom:6px; }
.menu-title h1{ font-size:32px; color:var(--navy); }
.menu-sub{ text-align:center; color:var(--muted); font-size:15px; margin:8px 0 26px; }

.cat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.cat-card{
  border:2px solid var(--navy); border-radius:16px; background:var(--cream); padding:16px 10px 14px;
  display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; transition:transform .15s ease, box-shadow .15s ease;
}
.cat-card:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(27,42,65,.18); }
.cat-card .em{ font-size:30px; }
.cat-card .lbl{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14.5px; color:var(--navy); }
.cat-card .cnt{ font-size:11.5px; color:var(--muted); font-weight:700; }

.all-btn{
  margin-top:20px; width:100%; border:none; border-radius:16px; padding:16px 20px;
  background:linear-gradient(120deg, var(--teal) 0%, var(--teal-dark) 100%); color:white;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; display:flex; align-items:center; justify-content:center; gap:10px;
}
.all-btn .em{ font-size:24px; }

/* ---------------- quiz screen ---------------- */
.quiz-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
.quiz-kicker{ font-weight:800; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); }
.quiz-score{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--navy); background:var(--cream);
  border-radius:999px; padding:6px 16px; border:1.5px solid var(--navy); }
.progress-track{ height:10px; background:var(--cream); border-radius:999px; overflow:hidden; margin-bottom:26px; border:1.5px solid var(--navy); }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--coral)); border-radius:999px; transition:width .3s ease; }

.q-sub{ text-align:center; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; color:var(--muted); margin-bottom:6px; }
.q-stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:180px; margin:6px 0 22px; gap:10px; }
.audio-btn{
  border:none; border-radius:999px; padding:10px 20px; background:var(--gold); color:white;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px;
  box-shadow:0 4px 10px rgba(245,166,35,.35); transition:transform .12s ease;
}
.audio-btn:hover{ transform:translateY(-2px); }
.audio-btn:disabled{ opacity:.5; cursor:default; transform:none; }
.audio-btn .ic{ font-size:18px; }
.audio-btn.playing{ animation:pulse .5s ease infinite alternate; }
@keyframes pulse{ from{ box-shadow:0 4px 10px rgba(245,166,35,.35);} to{ box-shadow:0 4px 18px rgba(245,166,35,.75);} }
.q-listen{ font-size:100px; line-height:1; filter:drop-shadow(0 4px 10px rgba(245,166,35,.35)); animation:listenPulse 1.4s ease-in-out infinite; }
@keyframes listenPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
.q-emoji{ font-size:110px; line-height:1; text-align:center; }
.q-fr{ text-align:center; font-size:19px; font-weight:700; color:var(--navy); margin-top:6px; }

.opts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.opt-btn{
  position:relative; border:2.5px solid var(--navy); border-radius:14px; background:var(--cream); padding:16px 14px;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; color:var(--navy); text-align:center;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.opt-btn:hover:not(:disabled){ transform:translateY(-2px); background:#FFF2DE; }
.opt-btn:disabled{ cursor:default; }
.opt-btn.correct{ background:#DFF6EF; border-color:var(--ok); border-width:4px; }
.opt-btn.wrong{ background:#FDE4E0; border-color:var(--bad); border-width:4px; }
.opt-btn.dim{ opacity:.4; }
.opt-badge{
  position:absolute; top:-10px; right:-10px; width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.opt-badge.ok{ background:var(--ok); }
.opt-badge.bad{ background:var(--bad); }

/* ---------------- image-based options (no reading needed) ---------------- */
.opt-btn.opt-image{ display:flex; align-items:center; justify-content:center; min-height:132px; padding:10px; }
.opt-btn.opt-image .obj-illus{ width:104px; height:104px; }

.feedback-row{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; min-height:44px; }
.feedback-msg{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px; }
.feedback-msg.ok{ color:var(--teal-dark); }
.feedback-msg.bad{ color:var(--coral-dark); }
.next-btn{ border:none; border-radius:12px; padding:12px 26px; background:var(--navy); color:white;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; opacity:0; pointer-events:none; transition:opacity .15s ease; }
.next-btn.show{ opacity:1; pointer-events:auto; }
.quit-link{ text-align:center; margin-top:18px; }
.quit-link button{ border:none; background:none; color:var(--muted); font-weight:700; font-size:13px; text-decoration:underline; }

/* ---------------- result screen ---------------- */
.result-screen{ text-align:center; }
.result-emoji{ font-size:64px; margin-bottom:6px; }
.result-title{ font-size:28px; color:var(--navy); margin-bottom:6px; }
.result-score{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:54px; color:var(--coral); margin:10px 0 4px; }
.result-msg{ color:var(--muted); font-size:15.5px; margin-bottom:26px; }
.result-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.result-btns button{ border:none; border-radius:14px; padding:14px 22px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15.5px; }
.btn-primary{ background:linear-gradient(120deg, var(--coral) 0%, var(--coral-dark) 100%); color:white; }
.btn-secondary{ background:var(--cream); color:var(--navy); border:1.5px solid var(--navy) !important; }

.hidden{ display:none !important; }

@media (max-width:640px){
  .screen{ padding:26px 18px 22px; }
  .cat-grid{ grid-template-columns:repeat(2,1fr); }
  .opts-grid{ grid-template-columns:1fr; }
  .q-emoji{ font-size:80px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- ============ MENU SCREEN ============ -->
  <div class="screen" id="screen-menu">
    <div class="top-row">
      <div class="brand"><span class="logo">🦜</span><span class="name">Pip's <span>English Adventure</span></span></div>
    </div>
    <div class="menu-title">
      <span class="kicker">Cours 3 — Révision</span>
      <h1>Quiz de révision</h1>
    </div>
    <div class="menu-sub">Choisis une catégorie, ou fais le quiz complet mélangé !</div>
    <div class="cat-grid" id="cat-grid"></div>
    <button class="all-btn" id="all-btn"><span class="em">🎲</span> Quiz complet mélangé (<span id="all-count"></span> questions)</button>
  </div>

  <!-- ============ QUIZ SCREEN ============ -->
  <div class="screen hidden" id="screen-quiz">
    <div class="quiz-top">
      <div class="quiz-kicker" id="quiz-kicker">CATÉGORIE</div>

    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="q-sub" id="q-sub"></div>
    <div class="q-stage">
      <div id="q-stage-illus"></div>
      <button class="audio-btn" id="audio-btn"><span class="ic">🔊</span><span id="audio-btn-label">Écouter</span></button>
    </div>
    <div class="opts-grid" id="opts-grid"></div>
    <div class="feedback-row">
      <div class="feedback-msg" id="feedback-msg"></div>
      <button class="next-btn" id="next-btn">Suivant →</button>
    </div>
    <div class="quit-link"><button id="quit-btn">← Retour au menu</button></div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div class="screen result-screen hidden" id="screen-result">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <h1 class="result-title" id="result-title">Bravo !</h1>
    <div class="result-score"><span id="result-score-val">0</span>/<span id="result-score-total">0</span></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-btns">
      <button class="btn-primary" id="retry-btn">🔁 Refaire ce quiz</button>
      <button class="btn-secondary" id="menu-btn">🏠 Retour au menu</button>
    </div>
  </div>
</div>

const audioPlayer = new Audio();
let audioPlayingBtn = null;
function playAudio(key, btnEl){
  const src = AUDIO_MAP[key];
  if(!src) return;
  if(audioPlayingBtn){ audioPlayingBtn.classList.remove('playing'); }
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  audioPlayer.src = src;
  audioPlayer.play().catch(() => {});
  if(btnEl){ btnEl.classList.add('playing'); audioPlayingBtn = btnEl; }
  audioPlayer.onended = () => { if(btnEl) btnEl.classList.remove('playing'); };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const catGrid = document.getElementById('cat-grid');
const catLabel = {};
CATEGORIES.forEach(c => { catLabel[c.key] = c; });
CATEGORIES.forEach(c => {
  const n = ALL_QUESTIONS.filter(q => q.category === c.key).length;
  const card = document.createElement('button');
  card.className = 'cat-card';
  card.innerHTML = `<span class="em">${c.emoji}</span><span class="lbl">${c.label}</span><span class="cnt">${n} questions</span>`;
  card.addEventListener('click', () => startQuiz(c.key));
  catGrid.appendChild(card);
});
document.getElementById('all-count').textContent = ALL_QUESTIONS.length;
document.getElementById('all-btn').addEventListener('click', () => startQuiz('all'));

const screenMenu = document.getElementById('screen-menu');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');

let currentSet = [];
let currentIdx = 0;
let score = 0;
let currentCatKey = 'all';

function startQuiz(catKey){
  currentCatKey = catKey;
  const pool = catKey === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.category === catKey);
  currentSet = shuffle(pool);
  currentIdx = 0;
  score = 0;
  screenMenu.classList.add('hidden');
  screenResult.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  document.getElementById('score-total').textContent = currentSet.length;
  showQuestion();
}

function showQuestion(){
  const q = currentSet[currentIdx];
  const kickerLbl = catLabel[q.category] ? catLabel[q.category].emoji + ' ' + catLabel[q.category].label : '';
  document.getElementById('quiz-kicker').textContent = kickerLbl + '  —  ' + (currentIdx+1) + '/' + currentSet.length;
  document.getElementById('score-val').textContent = score;
  document.getElementById('progress-fill').style.width = Math.round((currentIdx / currentSet.length) * 100) + '%';
  document.getElementById('q-sub').textContent = q.sub || '';
  document.getElementById('q-stage-illus').innerHTML = q.prompt;
  const audioBtn = document.getElementById('audio-btn');
  audioBtn.classList.remove('playing');
  const hasAudio = !!AUDIO_MAP[q.audio_key];
  audioBtn.style.display = hasAudio ? 'flex' : 'none';
  audioBtn.onclick = () => playAudio(q.audio_key, audioBtn);
  if(hasAudio){ playAudio(q.audio_key, audioBtn); }
  document.getElementById('feedback-msg').textContent = '';
  document.getElementById('feedback-msg').className = 'feedback-msg';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('show');

  const optsGrid = document.getElementById('opts-grid');
  optsGrid.innerHTML = '';
  q.options.forEach(opt => {
    const b = document.createElement('button');
    let extraCls = '';
    if(q.option_type === 'image') extraCls = ' opt-image';
    b.className = 'opt-btn' + extraCls;
    b.dataset.opt = opt;
    if(q.option_type === 'image'){
      const iconKey = q.category + '::' + opt;
      b.innerHTML = OPTION_ICONS[iconKey] || opt;
    } else {
      b.textContent = opt;
    }
    b.addEventListener('click', () => answer(opt, b));
    optsGrid.appendChild(b);
  });
}

function answer(chosen, btnEl){
  const q = currentSet[currentIdx];
  const buttons = document.querySelectorAll('#opts-grid .opt-btn');
  buttons.forEach(b => { b.disabled = true; if(b.dataset.opt !== q.answer) b.classList.add('dim'); });
  const fb = document.getElementById('feedback-msg');
  if(chosen === q.answer){
    btnEl.classList.remove('dim'); btnEl.classList.add('correct');
    btnEl.insertAdjacentHTML('beforeend', '<span class="opt-badge ok">✓</span>');
    score++;
    fb.textContent = '✅ Bravo, c\'est exact !';
    fb.classList.add('ok');
  } else {
    btnEl.classList.remove('dim'); btnEl.classList.add('wrong');
    btnEl.insertAdjacentHTML('beforeend', '<span class="opt-badge bad">✕</span>');
    buttons.forEach(b => {
      if(b.dataset.opt === q.answer){
        b.classList.remove('dim'); b.classList.add('correct');
        b.insertAdjacentHTML('beforeend', '<span class="opt-badge ok">✓</span>');
      }
    });
    fb.textContent = '❌ Pas tout à fait — la bonne réponse est « ' + q.answer + ' ».';
    fb.classList.add('bad');
  }
  document.getElementById('score-val').textContent = score;
  document.getElementById('next-btn').classList.add('show');
}

document.getElementById('next-btn').addEventListener('click', () => {
  currentIdx++;
  if(currentIdx >= currentSet.length){
    finishQuiz();
  } else {
    showQuestion();
  }
});

document.getElementById('quit-btn').addEventListener('click', () => {
  screenQuiz.classList.add('hidden');
  screenMenu.classList.remove('hidden');
});

function finishQuiz(){
  document.getElementById('progress-fill').style.width = '100%';
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');
  const total = currentSet.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  document.getElementById('result-score-val').textContent = score;
  document.getElementById('result-score-total').textContent = total;
  let emoji, title, msg;
  if(pct >= 90){ emoji='🏆'; title='Excellent, superstar !'; msg="Pip est très fier de toi, tu maîtrises très bien cette partie !"; }
  else if(pct >= 70){ emoji='🎉'; title='Très bien joué !'; msg='Encore un petit effort et ce sera parfait !'; }
  else if(pct >= 50){ emoji='💪'; title='Bon travail !'; msg='Continue à t\'entraîner, tu progresses bien !'; }
  else { emoji='🦜'; title='Pip t\'encourage !'; msg='On refait un tour ensemble pour bien mémoriser ?'; }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;
}

document.getElementById('retry-btn').addEventListener('click', () => startQuiz(currentCatKey));
document.getElementById('menu-btn').addEventListener('click', () => {
  screenResult.classList.add('hidden');
  screenMenu.classList.remove('hidden');
});
</script>
</body>
</html>
